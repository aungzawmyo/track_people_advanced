<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FaceScannerPro - People Tracking{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-video text-blue-600 text-2xl"></i>
                    <h1 class="text-2xl font-bold text-gray-800">FaceScannerPro</h1>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div class="tracking-status" id="tracking-status">
                        <span class="status-indicator status-inactive"></span>
                        <span class="text-red-600 font-semibold">Inactive</span>
                    </div>
                    
                    <div class="flex space-x-2">
                        <button id="start-tracking" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition duration-200">
                            <i class="fas fa-play mr-2"></i>Start
                        </button>
                        <button id="stop-tracking" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition duration-200 opacity-50 cursor-not-allowed" disabled>
                            <i class="fas fa-stop mr-2"></i>Stop
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow-lg mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="text-center text-gray-600">
                <p>&copy; 2025 FaceScannerPro. Advanced People Tracking System.</p>
            </div>
        </div>
    </footer>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
